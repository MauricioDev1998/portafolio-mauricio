<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="100%" style="background:#ffffff">
  <defs>
    <marker id="arrowC1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#28253D"/>
    </marker>
    <marker id="arrowC2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b14b4b"/>
    </marker>
  </defs>
  <style>text { font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }</style>

  <!-- flujo hacia adelante -->
  <line x1="220" y1="109" x2="280" y2="109" stroke="#28253D" stroke-width="2.5" marker-end="url(#arrowC1)"/>
  <line x1="460" y1="109" x2="520" y2="109" stroke="#28253D" stroke-width="2.5" marker-end="url(#arrowC1)"/>
  <line x1="700" y1="109" x2="760" y2="109" stroke="#28253D" stroke-width="2.5" marker-end="url(#arrowC1)"/>

  <!-- arcos de reversión -->
  <path d="M370,148 C370,210 130,210 130,148" fill="none" stroke="#b14b4b" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrowC2)"/>
  <text x="250" y="228" text-anchor="middle" fill="#9a3f3f" font-size="11" font-style="italic">Cancelar compromiso</text>

  <path d="M610,148 C610,210 370,210 370,148" fill="none" stroke="#b14b4b" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrowC2)"/>
  <text x="490" y="228" text-anchor="middle" fill="#9a3f3f" font-size="11" font-style="italic">Cancelar devengado</text>

  <path d="M850,148 C850,210 610,210 610,148" fill="none" stroke="#b14b4b" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrowC2)"/>
  <text x="730" y="228" text-anchor="middle" fill="#9a3f3f" font-size="11" font-style="italic">Anular / cancelar pago</text>

  <!-- etapas -->
  <rect x="40" y="70" width="180" height="78" rx="10" fill="#28253D"/>
  <text x="130" y="104" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="600">Aprobado /</text>
  <text x="130" y="120" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="600">Modificado</text>
  <text x="130" y="138" text-anchor="middle" fill="#c7cbe0" font-size="9.5">Techo presupuestal</text>

  <rect x="280" y="70" width="180" height="78" rx="10" fill="#28253D"/>
  <text x="370" y="110" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="600">Comprometido</text>
  <text x="370" y="128" text-anchor="middle" fill="#c7cbe0" font-size="9.5">Reserva presupuesto</text>
  <text x="370" y="141" text-anchor="middle" fill="#c7cbe0" font-size="9.5">(permite sobregiro)</text>

  <rect x="520" y="70" width="180" height="78" rx="10" fill="#28253D"/>
  <text x="610" y="110" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="600">Devengado</text>
  <text x="610" y="128" text-anchor="middle" fill="#c7cbe0" font-size="9.5">Bien/servicio recibido</text>
  <text x="610" y="141" text-anchor="middle" fill="#c7cbe0" font-size="9.5">y validado</text>

  <rect x="760" y="70" width="180" height="78" rx="10" fill="#28253D"/>
  <text x="850" y="110" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="600">Pagado</text>
  <text x="850" y="128" text-anchor="middle" fill="#c7cbe0" font-size="9.5">Pago liberado;</text>
  <text x="850" y="141" text-anchor="middle" fill="#c7cbe0" font-size="9.5">etapa final</text>

  <text x="490" y="295" text-anchor="middle" fill="#6b7280" font-size="11" font-style="italic">Cada reversión genera una póliza de contrapartida (cargo ↔ abono invertido); los sobregiros se permiten y se corrigen después vía recalendarización o traspaso.</text>
</svg>
